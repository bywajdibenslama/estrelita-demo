# Pubblica la cartella public/ su GitHub Pages a ogni push su main.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permette anche di rilanciarlo a mano dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; quello in corso non viene interrotto
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica la cartella public/
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
